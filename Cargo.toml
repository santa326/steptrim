[workspace]
resolver = "2"
members = ["crates/steptrim-core", "crates/steptrim-cli", "crates/steptrim-app"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
memchr = "2"
memmap2 = "0.9"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = 1
codegen-units = 4
lto = "thin"
