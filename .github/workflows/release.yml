name: release

# Builds the Windows binaries, a portable zip and an Inno Setup installer,
# signed through SignPath Foundation when the SIGNPATH_* settings exist.
#
# Trigger: push of a version tag (v0.1.0), or a manual run; a manual run with
# "publish" ticked publishes a release for the version in Cargo.toml, any
# other run only uploads the files as a workflow artifact.
#
# Signing happens twice: the four executables first, then the installer that
# was built from the signed executables. Each signing request waits for a
# team member's approval in SignPath (up to two hours). Without the
# SIGNPATH_ORGANIZATION_ID repository variable the signing steps are skipped
# and the unsigned files are packaged instead.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub release for the version in Cargo.toml"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      SIGNING: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release --workspace

      - name: Build
        run: cargo build --release --workspace

      - name: Read version from Cargo.toml
        id: ver
        shell: pwsh
        run: |
          $m = Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1
          $v = $m.Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "version $v, signing: $env:SIGNING"

      - name: Stage executables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\unsigned | Out-Null
          Copy-Item target\release\steptrim.exe, target\release\stepinfo.exe, target\release\stepprune.exe, target\release\stepreplicate.exe dist\unsigned\
          Get-ChildItem dist\unsigned | ForEach-Object { "$($_.Name): $($_.VersionInfo.ProductName) $($_.VersionInfo.ProductVersion)" }

      # ---- stage 1: sign the executables -------------------------------------

      - name: Upload unsigned executables
        if: env.SIGNING == 'true'
        id: upload-exes
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-executables-${{ steps.ver.outputs.version }}
          path: dist/unsigned/*.exe
          if-no-files-found: error

      - name: Sign executables (SignPath)
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'steptrim' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: binaries
          github-artifact-id: ${{ steps.upload-exes.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: dist/signed
          parameters: |
            version: ${{ toJSON(steps.ver.outputs.version) }}

      - name: Choose binaries
        id: bins
        shell: pwsh
        run: |
          $dir = if (Test-Path dist\signed\steptrim.exe) { "dist\signed" } else { "dist\unsigned" }
          "dir=$dir" >> $env:GITHUB_OUTPUT
          Write-Host "packaging from $dir"
          Get-ChildItem $dir | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            "$($_.Name): $($sig.Status) $($sig.SignerCertificate.Subject)"
          }

      - name: Package portable zip
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force dist\StepTrim | Out-Null
          Copy-Item "${{ steps.bins.outputs.dir }}\*.exe", README.md, LICENSE, CODE_SIGNING_POLICY.md dist\StepTrim\
          Compress-Archive -Path dist\StepTrim\* -DestinationPath "dist\StepTrim-$v-windows-x64.zip" -CompressionLevel Optimal

      # ---- stage 2: build and sign the installer -------------------------------

      - name: Build installer
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          New-Item -ItemType Directory -Force dist\installer-unsigned | Out-Null
          & $iscc "/DAppVersion=$v" "/DBinDir=..\${{ steps.bins.outputs.dir }}" "/Odist\installer-unsigned" installer\steptrim.iss
          Get-ChildItem dist\installer-unsigned

      - name: Upload unsigned installer
        if: env.SIGNING == 'true'
        id: upload-installer
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer-${{ steps.ver.outputs.version }}
          path: dist/installer-unsigned/*.exe
          if-no-files-found: error

      - name: Sign installer (SignPath)
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'steptrim' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: dist/installer-signed
          parameters: |
            version: ${{ toJSON(steps.ver.outputs.version) }}

      - name: Collect installer
        shell: pwsh
        run: |
          $src = if (Test-Path dist\installer-signed\*.exe) { "dist\installer-signed" } else { "dist\installer-unsigned" }
          Copy-Item "$src\*.exe" dist\
          Get-ChildItem dist -Filter *.exe | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            "$($_.Name): $($sig.Status) $($sig.SignerCertificate.Subject)"
          }

      # ---- publish ---------------------------------------------------------------

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File | Where-Object { $_.Extension -in ".zip", ".exe" } | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: StepTrim-${{ steps.ver.outputs.version }}-windows
          path: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: StepTrim ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS.txt
