name: release

# Builds the Windows binaries, a portable zip and an Inno Setup installer.
# A push of a version tag (v0.1.0) publishes them on a GitHub release;
# a manual run only uploads them as a workflow artifact.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release --workspace

      - name: Build
        run: cargo build --release --workspace

      - name: Read version from Cargo.toml
        id: ver
        shell: pwsh
        run: |
          $m = Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1
          $v = $m.Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "version $v"

      - name: Package portable zip
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force dist\StepTrim | Out-Null
          Copy-Item target\release\steptrim.exe, target\release\stepinfo.exe, target\release\stepprune.exe, target\release\stepreplicate.exe, README.md, LICENSE dist\StepTrim\
          Compress-Archive -Path dist\StepTrim\* -DestinationPath "dist\StepTrim-$v-windows-x64.zip" -CompressionLevel Optimal
          Get-ChildItem dist

      - name: Build installer
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$v" installer\steptrim.iss
          Get-ChildItem dist

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File | Where-Object { $_.Extension -in ".zip", ".exe" } | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: StepTrim-${{ steps.ver.outputs.version }}-windows
          path: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: StepTrim ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS.txt
